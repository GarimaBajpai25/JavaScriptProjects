<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>

            <h1>🌤️ Weather App</h1>

            <button id="themeBtn">🌙</button>

        </header>


        <!-- Search -->
        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button id="searchBtn">
                Search
            </button>

        </div>


        <!-- Location Button -->
        <button id="locationBtn" class="location-btn">
            📍 Use My Location
        </button>


        <!-- Loading -->
        <p id="loading">
            Loading weather...
        </p>


        <!-- Error -->
        <p id="error"></p>


        <!-- Weather Information -->
        <div id="weatherContainer" class="weather-container">

            <!-- Current Weather -->
            <div class="current-weather">

                <h2 id="cityName">
                    City
                </h2>

                <p id="date">
                    Date
                </p>

                <div class="weather-main">

                    <div id="weatherIcon">
                        ☀️
                    </div>

                    <div>
                        <h3 id="temperature">
                            --°C
                        </h3>

                        <p id="condition">
                            Weather
                        </p>
                    </div>

                </div>


                <!-- Weather Details -->
                <div class="details">

                    <div class="detail-box">

                        <span>🌡️</span>

                        <p>Feels Like</p>

                        <strong id="feelsLike">
                            --°C
                        </strong>

                    </div>


                    <div class="detail-box">

                        <span>💧</span>

                        <p>Humidity</p>

                        <strong id="humidity">
                            --%
                        </strong>

                    </div>


                    <div class="detail-box">

                        <span>💨</span>

                        <p>Wind</p>

                        <strong id="wind">
                            -- km/h
                        </strong>

                    </div>


                    <div class="detail-box">

                        <span>🌡️</span>

                        <p>Pressure</p>

                        <strong id="pressure">
                            -- hPa
                        </strong>

                    </div>

                </div>


                <!-- Sunrise Sunset -->
                <div class="sun-info">

                    <div>
                        🌅
                        <span>Sunrise</span>
                        <strong id="sunrise">
                            --
                        </strong>
                    </div>

                    <div>
                        🌇
                        <span>Sunset</span>
                        <strong id="sunset">
                            --
                        </strong>
                    </div>

                </div>

            </div>


            <!-- Forecast -->
            <div class="forecast-section">

                <h2>5-Day Forecast</h2>

                <div id="forecast" class="forecast">

                </div>

            </div>


            <!-- Recent Searches -->
            <div class="recent-section">

                <h2>Recent Searches</h2>

                <div id="recentSearches">

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
